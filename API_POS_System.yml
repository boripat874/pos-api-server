  /api/pos/receiptlist:
    post:
      summary: Receipt list
      description: "Retrieve a list of receipts. ; แต่ละใบเสร็จมี paymentstatus (1 ชำระครบ, 3 คืนเงินแล้ว), isrefunded, refundreason, refund_at, paymenttext และ payments (ช่องทาง ยอด transactionid refno linestatus)"
      tags:
        - Receipt
      security:
        - api_key: []
        - Authorization: []
      parameters:
        - name: period
          in: query
          required: false
          description: "ช่วงเวลา: today | thisweek | thismonth | thisyear | bydate (ค่าเริ่มต้น today)"
          schema:
            type: string
          example: today
        - name: date_start
          in: query
          required: false
          description: วันที่เริ่มต้น YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-01"
        - name: date_end
          in: query
          required: false
          description: วันที่สิ้นสุด YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-31"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: เลข Shop
              required:
                - shopid
            example:
              shopid: S250401
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: จํานวนรายการ
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        shopid:
                          type: string
                          description: เลข Shop
                        orderid:
                          type: string
                          description: เลข Order
                        receiptid:
                          type: string
                          description: เลข Receipt
                        ordernumber:
                          type: string
                          description: เลข Order
                        receiptnumber:
                          type: string
                          description: เลข Receipt
                        paymentType:
                          type: number
                          description: ประเภทการชําระเงิน
                        receiptcash:
                          type: number
                          description: จำนวนเงินที่ชําระ
                        receiptchange:
                          type: number
                          description: จำนวนเงินที่เหลือ
                        receiptdiscount:
                          type: number
                          description: จำนวนส่วนลด
                        totalprice:
                          type: number
                          description: ราคารวมของ Order
                        urlfile:
                          type: string
                          description: URL ไฟล์ใบเสร็จ
                        create_at:
                          type: number
                          description: เวลาสร้าง
              example:
                total: 1
                result:
                  - shopid: S250401
                    orderid: O250401
                    receiptid: R250401
                    ordernumber: ON250401
                    receiptnumber: RN250401
                    paymentType: 1
                    receiptcash: 1000
                    receiptchange: 0
                    receiptdiscount: 0
                    totalprice: 1000
                    urlfile: "https://example.com/receipt.pdf"
                    create_at: 1672531200
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/receiptcreate:
    post:
      summary: Receipt create
      description: "สร้างใบเสร็จ ; paymentType 1-4 (บิลช่องทางเดียว) ต้องส่ง transactionid ระบบสร้างข้อมูลการชำระ 1 ส่วนให้ (ไม่ส่ง -> 402) ; paymentType 5 (แบ่งชำระ) ต้องชำระครบผ่าน /api/pos/paymentstart แล้ว และ totalprice - receiptdiscount ต้องเท่ากับยอดที่ชำระ ระบบคิด receiptcash / receiptchange จากส่วนที่เป็นเงินสดเอง ; orderinfo.orderpaytype ถูกบันทึกตาม paymentType"
      tags:
        - Receipt
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ordernumber:
                  type: string
                  description: เลข Order
                receiptnumber:
                  type: string
                  description: เลข Receipt
                paymentType:
                  type: number
                  description: "1 = Credit Card, 2 = PromptPay, 3 = E-wallet, 4 = เงินสด, 5 = แบ่งชำระ"
                transactionid:
                  type: string
                  description: เลขธุรกรรม (บังคับเมื่อ paymentType 1-4)
                refno:
                  type: string
                  description: approval code จาก EDC (ไม่บังคับ)
                receiptcash:
                  type: number
                  description: จำนวนเงินที่ชําระ (บังคับเมื่อ paymentType 1-4)
                receiptchange:
                  type: number
                  description: จำนวนเงินที่ทอน (บังคับเมื่อ paymentType 1-4)
                receiptdiscount:
                  type: number
                  description: จำนวนเงินส่วนลด
                totalprice:
                  type: number
                  description: ราคารวมของ Order
              required:
                - ordernumber
                - receiptnumber
                - paymentType
                - receiptdiscount
                - totalprice
            examples:
              single:
                summary: บิลช่องทางเดียว
                value:
                  ordernumber: ON250401
                  receiptnumber: R250401
                  paymentType: 4
                  transactionid: RTP71895-250401-1
                  receiptcash: 200
                  receiptchange: 100
                  receiptdiscount: 0
                  totalprice: 100
              split:
                summary: บิลแบ่งชำระ
                value:
                  ordernumber: ON250402
