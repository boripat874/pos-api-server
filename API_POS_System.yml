                          description: เลขร้าน
                        promonameth:
                          type: string
                          description: ชื่อโปรโมชั่นภาษาไทย
                        typepromotions:
                          type: string
                          description: ประเภทโปรโมชั่น
                        discount:
                          type: number
                          description: ส่วนลด
                        datepromostart:
                          type: string
                          description: เวลาเริ่มโปรโมชั่น
                        datepromoend:
                          type: string
                          description: เวลาสิ้นสุดโปรโมชั่น
                        promoremark:
                          type: string
                          description: หมายเหตุ
                        status:
                          type: string
                          description: สถานะ
                        initial:
                          type: string
                          description: ชื่อย่อโปรโมชั่น
                        productidlist:
                          type: array
                          items:
                            type: object
                            properties:
                              pdpromotionid:
