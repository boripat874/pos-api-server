  /api/pos/paymentstart:
    post:
      summary: เริ่มแบ่งชำระ (Split payment start)
      description: "แบ่งชำระ 2-3 ส่วน ช่องทางห้ามซ้ำ ยอดรวมต้องเท่ากับยอดสุทธิของออเดอร์ (orderpricenet) และทุกส่วนต้องมี transactionid ; เครื่อง POS ต้องเป็นของร้านเดียวกับออเดอร์ ; ถ้ามีการชำระที่กำลังดำเนินการอยู่ จะส่งรายการเดิมกลับ (resumed = true) ; บิลช่องทางเดียวไม่ต้องเรียก API นี้ ให้ส่ง transactionid มากับ /api/pos/receiptcreate"
      tags:
        - Payment
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ordernumber:
                  type: string
                  description: เลข Order
                terminalid:
                  type: string
                  description: รหัสเครื่อง POS
                lines:
                  type: array
                  description: "2-3 ส่วน"
                  items:
                    type: object
                    properties:
                      transactionid:
                        type: string
                        description: "เลขธุรกรรมของส่วนนี้ (เครื่อง POS สร้าง, ห้ามซ้ำ, a-z 0-9 _ - สูงสุด 100 ตัว)"
                      paymenttype:
                        type: number
                        description: "1 = Credit Card, 2 = PromptPay, 3 = E-wallet, 4 = เงินสด"
                      amount:
                        type: number
                        description: ยอดของส่วนนี้ (ทศนิยมไม่เกิน 2 ตำแหน่ง)
                    required:
                      - transactionid
                      - paymenttype
                      - amount
              required:
                - ordernumber
                - terminalid
                - lines
            example:
              ordernumber: RTP71895261106091501
              terminalid: RTP71895
              lines:
                - transactionid: RTP71895-261106091501-1
                  paymenttype: 4
                  amount: 50
                - transactionid: RTP71895-261106091501-2
                  paymenttype: 2
                  amount: 50
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      orderpaymentid:
                        type: string
                        description: รหัสการชำระ
                      ordernumber:
                        type: string
                        description: เลข Order
                      issplit:
                        type: boolean
                        description: "true = แบ่งชำระ"
                      paymentstatus:
                        type: number
                        description: "0 กำลังชำระ, 1 ชำระครบ, 2 ยกเลิกระหว่างชำระ, 3 ยกเลิก/คืนเงินแล้ว"
                      paymentstatusname:
                        type: string
                        description: ชื่อสถานะ
                      totalamount:
                        type: number
                        description: ยอดที่ต้องชำระ
                      paidamount:
                        type: number
                        description: ยอดที่ชำระสำเร็จแล้ว
                      remainingamount:
                        type: number
                        description: ยอดคงเหลือ
                      paymenttype:
                        type: number
                        description: "5 = แบ่งชำระ (มีมากกว่า 1 ส่วน) หรือ 1-4"
                      paymenttext:
                        type: string
                        description: "เช่น เงินสด 50 + PromptPay 50"
                      receiptid:
                        type: string
                        description: ใบเสร็จที่ผูกกับการชำระ
                      refundreason:
                        type: string
                        description: เหตุผลยกเลิก/คืนเงิน
                      refund_at:
                        type: number
                        description: เวลาคืนเงิน (epoch วินาที)
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            lineno:
                              type: number
                              description: ลำดับ
                            transactionid:
                              type: string
                              description: เลขธุรกรรม
                            paymenttype:
                              type: number
                              description: "1-4"
                            paymenttypename:
                              type: string
                              description: ชื่อช่องทาง
                            amount:
                              type: number
                              description: ยอด
                            cashreceived:
                              type: number
                              description: เงินที่รับ (เงินสด)
                            cashchange:
                              type: number
                              description: เงินทอน (เงินสด)
                            refno:
                              type: string
                              description: approval code จาก EDC
                            linestatus:
                              type: number
                              description: "0 รอชำระ, 1 สำเร็จ, 2 ไม่สำเร็จ, 3 ยกเลิก, 4 คืนเงินแล้ว"
                            linestatusname:
                              type: string
                              description: ชื่อสถานะ
                            failreason:
                              type: string
                              description: เหตุผลที่ไม่สำเร็จ
                            paid_at:
                              type: number
                              description: เวลาที่ชำระสำเร็จ (epoch วินาที)
                      message:
                        type: string
                        description: ข้อความ
                  - type: object
                    properties:
                      resumed:
                        type: boolean
                        description: "true = มีการชำระค้างอยู่แล้ว ส่งรายการเดิมกลับ"
              example:
                orderpaymentid: "3f1c2a9e-1111-4c1d-9a55-0d6c2b1e7a10"
                ordernumber: RTP71895261106091501
                issplit: true
                paymentstatus: 0
                paymentstatusname: กำลังชำระ
                totalamount: 100
                paidamount: 0
                remainingamount: 100
                paymenttype: 5
                paymenttext: "เงินสด 50 + PromptPay 50"
                receiptid: null
                refundreason: null
                refund_at: null
                lines:
                  - lineno: 1
                    transactionid: RTP71895-261106091501-1
                    paymenttype: 4
                    paymenttypename: เงินสด
                    amount: 50
                    cashreceived: 0
                    cashchange: 0
                    refno: null
                    linestatus: 0
                    linestatusname: รอชำระ
                    failreason: null
                    paid_at: null
                  - lineno: 2
                    transactionid: RTP71895-261106091501-2
                    paymenttype: 2
                    paymenttypename: PromptPay
                    amount: 50
                    cashreceived: 0
                    cashchange: 0
                    refno: null
                    linestatus: 0
                    linestatusname: รอชำระ
                    failreason: null
                    paid_at: null
                message: Start payment Success
                resumed: false
        "400":
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความ
        "401":
          description: API key / token ไม่ถูกต้อง
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความ
        "404":
          description: ไม่พบข้อมูล
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความ
        "409":
          description: สถานะไม่ถูกต้อง หรือ transactionid ซ้ำ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความ
