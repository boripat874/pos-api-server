      parameters:
        - name: search
          in: query
          required: false
          description: คำค้นหา
          schema:
            type: string
          example: ""
        - name: page
          in: query
          required: false
          description: หน้าที่ต้องการ (เริ่ม 1)
          schema:
            type: integer
          example: 1
        - name: limit
          in: query
          required: false
          description: จำนวนรายการต่อหน้า
          schema:
            type: integer
          example: 10
        - name: period
          in: query
          required: false
          description: "ช่วงเวลา: today | thisweek | thismonth | thisyear | bydate (ค่าเริ่มต้น today)"
          schema:
            type: string
          example: today
        - name: date_start
          in: query
          required: false
          description: วันที่เริ่มต้น YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-01"
        - name: date_end
          in: query
          required: false
          description: วันที่สิ้นสุด YYYY-MM-DD (ใช้เมื่อ period=bydate)
