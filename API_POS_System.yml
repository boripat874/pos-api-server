  /api/backoffice/terminallist:
    get:
      summary: รายการเครื่อง POS (terminalid ของแต่ละร้าน)
      description: เฉพาะสิทธิ์ Admin ; online = มี heartbeat ภายใน 5 นาที
      tags:
        - Backoffice - POS Terminal
      security:
        - api_key: []
        - Authorization: []
      parameters:
        - name: search
          in: query
          required: false
          description: คำค้นหา
          schema:
            type: string
          example: ""
        - name: shopid
          in: query
          required: false
          description: กรองตามร้าน
          schema:
            type: string
          example: ""
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                total: 1
                result:
                  - terminalid: RTP71887
                    shopid: POS_SHOP_001
                    shopnameth: ร้านปอนด์
                    terminalname: เครื่อง POS 1
                    details: ""
                    status: true
                    online: true
                    last_seen: "2026-10-25 15:20"
                    create_at: "2026-10-25 15:00"
                    update_at: "2026-10-25 15:00"
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "403":
          description: Admin only
        "500":
          description: Internal Server Error
  /api/backoffice/terminalcreate:
    post:
      summary: เพิ่มเครื่อง POS
      description: เฉพาะสิทธิ์ Admin
      tags:
        - Backoffice - POS Terminal
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminalid:
                  type: string
                  description: "รหัสเครื่อง POS (a-z, 0-9, _ , -)"
                shopid:
                  type: string
                  description: ร้านที่เครื่องนี้สังกัด
                terminalname:
                  type: string
                  description: ชื่อเรียกเครื่อง
                details:
                  type: string
                  description: รายละเอียด
                status:
                  type: boolean
                  description: true = เปิดใช้งาน
              required:
                - terminalid
                - shopid
            example:
              terminalid: RTP71899
              shopid: POS_SHOP_002
              terminalname: เครื่อง POS 6
              details: ""
              status: true
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                terminalid: RTP71899
                shopid: POS_SHOP_002
                message: Create terminal Success
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "403":
          description: Admin only
        "404":
          description: shopid not found
        "409":
          description: terminalid already exists
        "500":
          description: Internal Server Error
  /api/backoffice/terminalupdate:
    put:
      summary: แก้ไขเครื่อง POS
      description: |
        เฉพาะสิทธิ์ Admin ; ส่งเฉพาะ field ที่ต้องการแก้
        ย้ายร้าน / ปิดใช้งาน / เปลี่ยน terminalid -> สถานะ online ของเครื่องเดิมเป็น offline ทันที
      tags:
        - Backoffice - POS Terminal
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminalid:
                  type: string
                  description: รหัสเครื่องที่จะแก้
                newterminalid:
                  type: string
                  description: รหัสเครื่องใหม่ (ถ้าต้องการเปลี่ยน)
                shopid:
                  type: string
                  description: ย้ายไปร้าน
                terminalname:
                  type: string
                  description: ชื่อเรียกเครื่อง
                details:
                  type: string
                  description: รายละเอียด
                status:
                  type: boolean
                  description: "true = เปิด, false = ปิดใช้งาน"
              required:
                - terminalid
            example:
              terminalid: RTP71899
              newterminalid: RTP71899
              shopid: POS_SHOP_001
              terminalname: เครื่อง POS 11
              details: ""
              status: false
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                terminalid: RTP71899
                message: Update terminal Success
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "403":
          description: Admin only
        "404":
          description: terminalid / shopid not found
        "409":
          description: newterminalid already exists
        "500":
          description: Internal Server Error
components:
  securitySchemes:
    api_key:
      type: apiKey
      description: API Key สำหรับ Authentication
      in: header
      name: X-API-KEY
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token สำหรับยืนยันการเข้าใช้งาน
security:
  - api_key: []
  - Authorization: []
