  /api/backoffice/reportorderlist:
    post:
      summary: รายงานการสั่งซื้อ (Online + Offline)
      description: |
        ordertype: 0 = Online, 1 = Offline (ต้องมีใบเสร็จ)
        Online มาจาก 2 แหล่ง: orderinfo (ordertype = 0) และ onlineorderinfo (รับผ่าน POST /api/orderinsert)
        paymenttype:
        - Offline: ตัวเลข 1 = Credit Card, 2 = PromptPay, 3 = E-wallet, 4 = เงินสด
        - Online จาก /api/orderinsert: ข้อความตาม payment.channel เช่น Credit Card
        - ไม่มีข้อมูล: null (หน้าเว็บแสดง -)
        ออเดอร์ Online แสดงในตารางอย่างเดียว ไม่นับรวมในยอดรวม
      tags:
        - Backoffice - Report
      security:
        - api_key: []
        - Authorization: []
      parameters:
        - name: search
          in: query
          required: false
          description: คำค้นหา
          schema:
            type: string
          example: ""
        - name: period
          in: query
          required: false
          description: "ช่วงเวลา: today | thisweek | thismonth | thisyear | bydate (ค่าเริ่มต้น today)"
          schema:
            type: string
          example: today
        - name: date_start
          in: query
          required: false
          description: วันที่เริ่มต้น YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-01"
        - name: date_end
          in: query
          required: false
          description: วันที่สิ้นสุด YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-31"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: รหัสร้าน
              required:
                - shopid
            example:
              shopid: POS_SHOP_001
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                total: 3
                result:
                  - ordertimestamp: "2026-10-27 13:06"
                    ordernumber: OID2026102713064212222
                    ordertype: 0
                    orderchannel: Online
                    ordertotalprice: 123
                    vat7pc: 0
                    ordertotaldiscount: 0
                    orderpricenet: 123
                    paymenttype: Credit Card
                    urlfile: null
                    receiptnumber: "02000005"
                    referencenumber: 0225691027000005
                    buyername: TestNuttinan Test
                    orderstatus: COMPLETED
                    deliveryoption: PICKUP
                  - ordertimestamp: "2026-10-25 10:30"
                    ordernumber: ON250001
                    ordertype: 0
                    orderchannel: Online
                    ordertotalprice: 120
                    vat7pc: 0
                    ordertotaldiscount: 0
