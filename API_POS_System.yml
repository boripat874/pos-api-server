  /api/pos/orderinsert:
    post:
      summary: รับออเดอร์ Online จากระบบภายนอก
      description: |
        เก็บแยกจาก order หลัก (ตาราง onlineorderinfo / onlineorderdetail) และไม่ผูกกับร้าน
        ไม่ตัดสต็อก POS (ออเดอร์ Online แยก stock กับ POS)
        - ต้องมี X-API-KEY และ token จาก /api/pos/signin
        - แสดงเฉพาะในรายงานการสั่งซื้อของ Backoffice เมื่อ Admin เลือก Online หรือ ทั้งหมด
        - ไม่นับรวมในยอดรวม และไม่แสดงใน Dashboard
        - orderNumber ซ้ำ -> 409
      tags:
        - Order
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderNumber:
                  type: string
                  description: เลข Order (ห้ามซ้ำ)
                receiptNumber:
                  type: string
                  description: เลขใบเสร็จ
                referenceNumber:
                  type: string
                  description: เลขอ้างอิง
                buyerName:
                  type: string
                  description: ชื่อผู้ซื้อ
                orderDateTime:
                  type: string
                  description: วันเวลา Order (ISO 8601 พร้อม timezone)
                orderStatus:
                  type: string
                  description: สถานะ Order
                deliveryOption:
                  type: string
                  description: วิธีรับสินค้า
                netAmount:
                  type: number
                  description: ยอดสุทธิ
                items:
                  type: array
                  description: "รายการสินค้า (productCode, productName, quantity, unitPrice, discount)"
                  items:
                    type: object
                payment:
                  type: object
                  description: "ข้อมูลการชำระ (channel เป็นข้อความ, time, transactionNumber)"
              required:
                - orderNumber
                - orderDateTime
                - netAmount
                - items
            example:
              orderNumber: OID2026102713064212222
              receiptNumber: "02000005"
              referenceNumber: 0225691027000005
              buyerName: TestNuttinan Test
              orderDateTime: "2026-10-27T13:06:42.776061+07:00"
              orderStatus: COMPLETED
              deliveryOption: PICKUP
              netAmount: 123.0
              items:
                - productCode: SKU114
                  productName: ตุ๊กตาอาร์ททอย
                  quantity: 1
                  unitPrice: 122.0
                  discount: 0.0
                - productCode: SKU-PP-01
                  productName: ตุ๊กตาผึ้งน้อย
                  quantity: 1
                  unitPrice: 1.0
                  discount: 0.0
              payment:
                channel: Credit Card
                time: "2026-10-27T13:07:22+07:00"
                transactionNumber: "11220914"
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                orderNumber: OID2026102713064212222
                message: Insert order Success
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "409":
          description: orderNumber already exists
        "500":
          description: Internal Server Error
