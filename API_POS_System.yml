                        type: number
                        description: จำนวนที่สั่ง
                      productprice:
                        type: number
                        description: ราคาของ Product
                      additional:
                        type: string
                        description: รายการเพิ่มเติม
                      remark:
                        type: string
                        description: Remark ของรายการ
