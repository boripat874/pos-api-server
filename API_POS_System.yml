openapi: 3.0.0
info:
  title: POS API Document
  description: |
    API for POS System (เครื่อง POS) และ Backoffice
    - /api/pos/* : เครื่อง POS
    - /api/backoffice/* : เว็บ Backoffice (อยู่ท้ายเอกสาร)
  version: 1.0.13
servers:
  - url: "http://10.10.46.2:80"
    description: Development Server
paths:
  /api/pos/checklogin:
    get:
      summary: Check login
      description: Check if the user is logged in.
      tags:
        - Verify identity
      security:
        - api_key: []
        - Authorization: []
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความอธิบายสถานะ
                  level:
                    type: number
                    description: สิทธิ์การใช้งานผู้ใช้
              example:
                message: User is logged in
                level: Employee
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/signin:
    post:
      summary: Login (เครื่อง POS)
      description: |
        ล็อกอินได้เฉพาะเครื่อง POS ของร้านตัวเอง
        - terminalid ต้องลงทะเบียนไว้ใน Backoffice > ตั้งค่าเครื่อง POS และเปิดใช้งาน
        - Manager / Employee: ร้านของผู้ใช้ต้องตรงกับร้านของเครื่อง
        - Owner: ร้านของเครื่องต้องอยู่ในกลุ่มร้านของตัวเอง ; Admin: ได้ทุกร้าน
        - token ที่ได้มี shopid และ terminalid ของเครื่อง
      tags:
        - Verify identity
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uinfologinname:
                  type: string
                  description: ชื่อผู้ใช้
                uinfologinpass:
                  type: string
                  description: รหัสผ่าน
                terminalid:
                  type: string
                  description: รหัสเครื่อง POS
              required:
                - uinfologinname
                - uinfologinpass
                - terminalid
            example:
              uinfologinname: somsri
              uinfologinpass: "******"
              terminalid: RTP71000
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                shopid: POS_SHOP_001
                terminalid: RTP71000
                level: Employee
                message: Sign in successfully
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "403":
          description: เครื่องไม่ได้ลงทะเบียน / ถูกปิดใช้งาน / ร้านไม่เปิดใช้งาน / ผู้ใช้ไม่ใช่ร้านของเครื่องนี้ (ดู message)
        "500":
          description: Internal Server Error
  /api/pos/signout:
    get:
      summary: Logout
      description: Logout from the system.
      tags:
        - Verify identity
      security:
        - api_key: []
        - Authorization: []
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: ข้อความอธิบายสถานะ
              example:
                message: Sign out successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/userinfo:
    get:
      summary: User info
      description: Retrieve user information.
      tags:
        - Verify identity
      security:
        - api_key: []
        - Authorization: []
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  uinfoname:
                    type: string
                    description: ชื่อผู้ใช้
                  uinfologinname:
                    type: string
                    description: Username
                  level:
                    type: number
                    description: สิทธิ์การใช้งานผู้ใช้
              example:
                uinfoname: Userremployee
                uinfologinname: useremployee
                level: Employee
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/shopuserlist:
    post:
      summary: รายชื่อผู้ใช้ของร้าน (Manager / Employee)
      description: |
        คืนข้อมูลผู้ใช้ทั้งหมดของร้าน ยกเว้นรหัสผ่าน เฉพาะสิทธิ์ Manager และ Employee ที่ยังใช้งานอยู่
        ใช้แค่ X-API-KEY (ไม่ต้อง login)
      tags:
        - Verify identity
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: รหัสร้าน
              required:
                - shopid
            example:
              shopid: POS_SHOP_001
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                shopid: POS_SHOP_001
                shopnameth: ร้านปอนด์
                total: 1
                result:
                  - uinfoid: U010
                    ugroupid: G001
                    shopid: POS_SHOP_001
                    uinfologinname: somsri
                    uinfoname: สมศรี รักดี
                    uinfoemail: somsri@example.com
                    level: Employee
                    details: ""
                    uinfodata1: null
                    uinfodata2: null
                    status: true
                    create_at: "2026-10-01 09:00"
                    update_at: "2026-10-20 15:30"
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "404":
          description: shopid not found
        "500":
          description: Internal Server Error
  /api/pos/terminalheartbeat:
    post:
      summary: Terminal heartbeat (สถานะเครื่อง POS)
      description: |
        เครื่อง POS ยิงเข้ามาเรื่อยๆ (แนะนำทุก 60 วินาที) ขณะที่ user login อยู่
        - เช็ค API key และ user login (Bearer token จาก /api/pos/signin)
        - ไม่มีอัปเดตภายใน 5 นาที -> Backoffice แสดงไฟสีเทา และ openApi /api/availableslot จะไม่ส่ง slot ให้ App
        - ส่ง status = "logout" (หรือเรียก /api/pos/signout) -> offline ทันที
      tags:
        - Verify identity
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminalid:
                  type: string
                  description: "รหัสเครื่อง POS (a-z, 0-9, _ , -) ไม่ซ้ำกันภายในร้าน"
                shopid:
                  type: string
                  description: รหัสร้าน (ไม่ส่ง = ใช้ร้านของ user)
                appversion:
                  type: string
                  description: เวอร์ชันแอป POS
                status:
                  type: string
                  enum:
                    - online
                    - logout
                  description: ค่าเริ่มต้น online
              required:
                - terminalid
            example:
              terminalid: T01
              shopid: POS_SHOP_001
              appversion: 1.0.0
              status: online
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                shopid: POS_SHOP_001
                terminalid: T01
                status: online
                server_time: 1761320000
                online_window_sec: 300
                message: Heartbeat received
        "400":
          description: Invalid request
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หรือ token หมดอายุ)
        "403":
          description: User ไม่มีสิทธิ์ในร้านนี้
        "404":
          description: shopid not found
  /api/pos/shopslist:
    get:
      summary: รายชื่อร้านของผู้ใช้
      tags:
        - Shop
      security:
        - api_key: []
        - Authorization: []
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                total: 1
                result:
                  - shopid: POS_SHOP_001
                    shopnameth: ร้านปอนด์
                    create_at: 1761000000
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "500":
          description: Internal Server Error
  /api/pos/shopdetail:
    post:
      summary: Shop detail
      description: Retrieve details of a shop.
      tags:
        - Shop
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: เลข Shop
              required:
                - shopid
            example:
              shopid: S250401
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  shopid:
                    type: string
                    description: เลข Shop
                  merid:
                    type: string
                    description: เลข merchant
                  shoptype:
                    type: string
                    description: หมวดหมู Store
                  shopnameth:
                    type: string
                    description: ชื่อ Store ภาษาไทย
                  shopnameeng:
                    type: string
                    description: ชื่อ Store ภาษาอังกฤษ
                  shopopentime:
                    type: string
                    description: เวลาเปิด Store
                  shopclosetime:
                    type: string
                    description: เวลาเปิด Store
                  shopexpiredate:
                    type: string
                    description: เวลาหมดอายุ Store
                  shopdata1:
                    type: string
                    description: ข้อมูล Store 1
                  shopdata2:
                    type: string
                    description: ข้อมูล Store 2
                  shoplogoimage:
                    type: string
                    description: รูปภาพ shop
                  ugroupid:
                    type: string
                    description: เลขกลุ่ม User
              example:
                shopid: S250401
                merid: M250401
                shoptype: type1
                shopnameth: ร้านค้า 1
                shopnameeng: shop 1
                shopopentime: "08:00"
                shopclosetime: "17:00"
                shopexpiredate: "2021-01-30"
                shopdata1: shop data 1
                shopdata2: shop data 2
                shoplogoimage: "https://placehold.co/600x400"
                ugroupid: G250401
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/orderlist:
    post:
      summary: Order list
      description: Retrieve a list of orders.
      tags:
        - Order
      security:
        - api_key: []
        - Authorization: []
      parameters:
        - name: period
          in: query
          required: false
          description: "ช่วงเวลา: today | thisweek | thismonth | thisyear | bydate (ค่าเริ่มต้น today)"
          schema:
            type: string
          example: today
        - name: date_start
          in: query
          required: false
          description: วันที่เริ่มต้น YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-01"
        - name: date_end
          in: query
          required: false
          description: วันที่สิ้นสุด YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-31"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: เลข Shop
              required:
                - shopid
            example:
              shopid: S250401
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: จํานวนรายการ
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        orderid:
                          type: string
                          description: เลข ID Order
                        shopid:
                          type: string
                          description: เลข Shop
                        ordernumber:
                          type: string
                          description: เลข Order
                        ordertype:
                          type: number
                          description: "ประเภท Order (0 = จาก ZooApp, 1 = จากPOS)"
                        ordertimestamp:
                          type: number
                          description: เวลา Order
                        ordertimestamp_update:
                          type: number
                          description: เวลา Update Order
                        orderstatus:
                          type: string
                          description: "สถานะ [0 = รอดำเนินการ , 1 = ยืนยันรายการ (จ่ายแล้ว) , 2 = ยืนยันรายการ (ยังไม่จ่าย) , 3 = ถูกยกเลิดโดยระบบ , 4 = ถูกยกเลิกโดยลูกค้า , 5 = รับรายการ , 6 = จัดเตรียมสินค้า , 7 = เสร็จสิ้น , 8 = ยกเลิกโดยผู้ขาย , 9 = การจ่ายเงินล้มเหลว , 10 = สินค้าพร้อมรับ , 11 = รอจัดส่ง , 12 = กำลังจัดส่ง , 13 = จัดส่งล้มเหลว]"
                        ordertotalprice:
                          type: number
                          description: ราคารวม Order
                        pickupnow:
                          type: number
                          description: "0 = ไม่สามารถรับทันทีได้ , 1 = สามารถรับทันทีได้"
                        starttime:
                          type: string
                          description: เวลาเริ่ม
                        endtime:
                          type: string
                          description: เวลาสิ้นสุด
              example:
                total: 2
                result:
                  - orderid: O250401
                    shopid: S250401
                    ordernumber: ON250401
                    ordertype: 1
                    ordertimestamp: 1737973730
                    ordertimestamp_update: 1737973730
                    orderstatus: 1
                    ordertotalprice: 2000
                    pickupnow: 1
                    starttime: "08:00"
                    endtime: "08:30"
                  - orderid: O250402
                    shopid: S250401
                    ordernumber: ON250401
                    ordertimestamp: 1737973730
                    orderstatus: 1
                    ordertotalprice: 3000
                    pickupnow: 1
                    starttime: "08:00"
                    endtime: "08:30"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/orderdetail:
    post:
      summary: Order detail
      description: Retrieve details of an order.
      tags:
        - Order
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ordernumber:
                  type: string
                  description: เลข Order
              required:
                - ordernumber
            example:
              ordernumber: ON250401
      responses:
        "200":
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderid:
                    type: string
                    description: เลข ID Order
                  shopid:
                    type: string
                    description: เลข Shop
                  ordernumber:
                    type: string
                    description: เลข Order
                  ordertype:
                    type: number
                    description: "ประเภท Order (0 = จาก ZooApp, 1 = จากPOS)"
                  ordertimestamp:
                    type: number
                    description: เวลา Order
                  ordertimestamp_update:
                    type: number
                    description: เวลา Update Order
                  orderstatus:
                    type: string
                    description: "สถานะ [0 = รอดำเนินการ , 1 = ยืนยันรายการ (จ่ายแล้ว) , 2 = ยืนยันรายการ (ยังไม่จ่าย) , 3 = ถูกยกเลิดโดยระบบ , 4 = ถูกยกเลิกโดยลูกค้า , 5 = รับรายการ , 6 = จัดเตรียมสินค้า , 7 = เสร็จสิ้น , 8 = ยกเลิกโดยผู้ขาย , 9 = การจ่ายเงินล้มเหลว , 10 = สินค้าพร้อมรับ , 11 = รอจัดส่ง , 12 = กำลังจัดส่ง , 13 = จัดส่งล้มเหลว]"
                  ordertotalprice:
                    type: number
                    description: ราคารวม Order
                  ordertotaldiscount:
                    type: number
                    description: ส่วนลด Order
                  pickupnow:
                    type: number
                    description: "0 = ไม่สามารถรับทันทีได้ , 1 = สามารถรับทันทีได้"
                  starttime:
                    type: string
                    description: เวลาเริ่ม
                  endtime:
                    type: string
                    description: เวลาสิ้นสุด
                  orderispay:
                    type: number
                    description: "0 = ยังไม่ได้ชําระ , 1 = ชําระแล้ว"
                  productinorder:
                    type: array
                    items:
                      type: object
                      properties:
                        linenumber:
                          type: number
                          description: หมายเลขรายการ
                        productid:
                          type: string
                          description: เลข Product
                        qty:
                          type: number
                          description: จำนวนที่สั่ง
                        productprice:
                          type: number
                          description: ราคาของ Product
                        remark:
                          type: string
                          description: Remark ของรายการ
              example:
                orderid: O250401
                shopid: S250401
                ordernumber: ON250401
                ordertype: 1
                ordertimestamp: 1737973730
                ordertimestamp_update: 1737973730
                orderstatus: 1
                ordertotalprice: 3000
                ordertotaldiscount: 100
                pickupnow: 1
                starttime: "08:00"
                endtime: "08:30"
                productinorder:
                  - linenumber: 1
                    productid: P250401
                    qty: 1
                    productprice: 100
                    remark: "-"
                  - linenumber: 2
                    productid: P250402
                    qty: 1
                    productprice: 200
                    remark: "-"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Invalid request
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: Unauthorized
  /api/pos/ordercreate:
    post:
      summary: Order create
      description: "Create a new order. ; ตัดสต็อก - ลด productremain ตาม qty ของสินค้าทุกรายการ (ติดลบได้) ; สินค้าที่ไม่พบในร้าน (ไม่มี / ปิดใช้งาน / ต่างร้าน) -> 402 Product not found"
      tags:
        - Order
      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: เลข Shop
                ordernumber:
                  type: string
                  description: เลข Order
                terminalid:
                  type: string
                  description: เลข Terminal
                transactionid:
                  type: string
                  description: เลข Transaction
                ordertimestamp:
                  type: number
                  description: เวลา Order
                ordertotalprice:
                  type: number
                  description: ราคารวม Order
                ordertotaldiscount:
                  type: number
                  description: ส่วนลด Order
                pickupnow:
                  type: number
