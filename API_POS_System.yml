  /api/backoffice/reportorderlist:
    post:
      summary: รายงานการสั่งซื้อ
      description: |
        shopid: รหัสร้าน หรือค่าพิเศษ (เฉพาะ Admin, ไม่ใช่ Admin -> 403)
        แบ่งชำระ - paymenttype เป็นข้อความ เช่น เงินสด 50 + PromptPay 50 (ช่องทางเดียวยังเป็น 1-4) ; เพิ่ม issplit, paymentstatus, paymentstatusname, isrefunded, refundreason, refund_at, payments ; แสดงบิลที่คืนเงินแล้วด้วย
        - all = ทุกร้าน
        - online = ออเดอร์จาก /api/pos/orderinsert
        ร้านปกติ: ออเดอร์ของร้าน (Offline ที่มีใบเสร็จ + Online ใน orderinfo ordertype = 0)
        online: เฉพาะออเดอร์จาก /api/pos/orderinsert (shopnameth = Online)
        all: ออเดอร์ทุกร้าน + ออเดอร์จาก /api/pos/orderinsert
        paymenttype: Offline เป็นตัวเลข 1 = Credit Card, 2 = PromptPay, 3 = E-wallet, 4 = เงินสด ; orderinsert เป็นข้อความตาม payment.channel ; ไม่มี = null
      tags:
        - Backoffice - Report
      security:
        - api_key: []
        - Authorization: []
      parameters:
        - name: search
          in: query
          required: false
          description: คำค้นหา
          schema:
            type: string
          example: ""
        - name: period
          in: query
          required: false
          description: "ช่วงเวลา: today | thisweek | thismonth | thisyear | bydate (ค่าเริ่มต้น today)"
          schema:
            type: string
          example: today
        - name: date_start
          in: query
          required: false
          description: วันที่เริ่มต้น YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-01"
        - name: date_end
          in: query
          required: false
          description: วันที่สิ้นสุด YYYY-MM-DD (ใช้เมื่อ period=bydate)
          schema:
            type: string
          example: "2026-10-31"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: รหัสร้าน / all / online
              required:
                - shopid
            example:
              shopid: POS_SHOP_001
      responses:
        "200":
          description: Success response
          content:
            application/json:
              example:
                total: 2
                result:
                  - ordertimestamp: "2026-10-27 13:06"
                    shopnameth: Online
                    ordernumber: OID2026102713064212222
                    ordertype: 0
                    orderchannel: Online
                    ordertotalprice: 123
                    vat7pc: 0
                    ordertotaldiscount: 0
                    orderpricenet: 123
                    paymenttype: Credit Card
                    urlfile: null
                    receiptnumber: "02000005"
                    referencenumber: 0225691027000005
                    buyername: TestNuttinan Test
                    orderstatus: COMPLETED
                    deliveryoption: PICKUP
                  - ordertimestamp: "2026-10-25 11:00"
                    shopnameth: ร้านปอนด์
                    ordernumber: POS0001
                    ordertype: 1
                    orderchannel: Offline
                    ordertotalprice: 100
                    vat7pc: 0
                    ordertotaldiscount: 10
                    orderpricenet: 90
                    paymenttype: 4
                    urlfile: null
        "400":
          description: Invalid request (ข้อมูลที่ส่งมาไม่ถูกต้อง)
        "401":
          description: Unauthorized (API key / token ไม่ถูกต้อง หมดอายุ หรือถูก revoke)
        "402":
          description: ข้อผิดพลาดทางธุรกิจ เช่น ไม่พบข้อมูล หรือ Request timed out (ดู message)
        "403":
          description: Admin only (all / online)
        "500":
          description: Internal Server Error
