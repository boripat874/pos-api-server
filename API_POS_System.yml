      security:
        - api_key: []
        - Authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopid:
                  type: string
                  description: เลข Shop
                ordernumber:
                  type: string
                  description: เลข Order
                terminalid:
                  type: string
                  description: เลข Terminal
                transactionid:
                  type: string
                  description: เลข Transaction
                ordertimestamp:
                  type: number
                  description: เวลา Order
                ordertotalprice:
                  type: number
                  description: ราคารวม Order
                ordertotaldiscount:
                  type: number
                  description: ส่วนลด Order
                pickupnow:
                  type: number
                  description: "0 = ไม่สามารถรับทันทีได้ , 1 = สามารถรับทันทีได้"
                starttime:
                  type: number
                  description: เวลาเริ่ม Order
                endtime:
                  type: number
                  description: เวลาสิ้นสุด Order
                productinorder:
                  type: array
